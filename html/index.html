<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Kubernetes Website</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e3a8a);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            width: 500px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 15px;
        }

        p {
            font-size: 1.1rem;
            margin-bottom: 10px;
        }

        .status {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background: #22c55e;
            color: white;
            border-radius: 20px;
            font-weight: bold;
        }

        footer {
            margin-top: 30px;
            font-size: 0.9rem;
            color: #d1d5db;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>🚀 Welcome!</h1>

    <p>Your Nginx web server is running successfully.</p>
    <p>This page is being served as a static HTML website.</p>

    <div class="status">
        Kubernetes + Docker + Nginx ✔
    </div>

    <footer>
        <p>Created by Dipankar Mohanty</p>
        <p>Powered by HTML & CSS</p>
    </footer>
</div>

</body>
</html>
