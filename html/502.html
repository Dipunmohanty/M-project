<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bad Gateway - 502</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fdfdfd;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
        }

        .error-container {
            max-width: 500px;
        }

        .error-code {
            font-size: 8rem;
            font-weight: 900;
            color: #d97706; /* Amber/Orange for gateway issues */
            line-height: 1;
            margin-bottom: 15px;
            animation: pulse 2.5s infinite ease-in-out;
        }

        .error-title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 15px;
            color: #1f2937;
        }

        .error-message {
            font-size: 1.1rem;
            color: #4b5563;
            line-height: 1.6;
        }

        /* Continuous fade pulse to represent a bad connection signal */
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(0.98); }
        }
    </style>
</head>
<body>

    <div class="error-container">
        <div class="error-code">502</div>
        <h1 class="error-title">Bad Gateway</h1>
        <p class="error-message">
            A bad witch, used her magically scissors to cut your connection, and we apologize for that. But please wait for a while, as we initiate a witch hunt and restore the magical world of internet for you.
        </p>
    </div>

</body>
</html>
