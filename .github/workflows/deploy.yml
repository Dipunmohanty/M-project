name: Production Web Pages, Service, and Ingress CI/CD

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  id-token: write

jobs:
  build-and-push-web-image:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push Docker image with Web Content
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/m-project:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/m-project:${{ github.sha }}

  deploy-service:
    needs: build-and-push-web-image
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # 1. Keyless OIDC Authentication with Google Cloud
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ secrets.GCP_WORKLOAD_PROVIDER }}
        service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

    # 2. Automatically generates a FRESH kubeconfig and sets up the modern gke-gcloud-auth-plugin
    - name: Set up GKE Credentials
      uses: google-github-actions/get-gke-credentials@v2
      with:
        cluster_name: ${{ secrets.GCP_CLUSTER_NAME }}
        location: ${{ secrets.GCP_REGION }}
        project_id: ${{ secrets.GCP_PROJECT_ID }}
        use_auth_provider: false

    # 3. Deploy App Layer
    - name: Deploy Service App Layer (Web App Update)
      run: |
        kubectl apply -f k8s-service.yml
        kubectl rollout restart deployment/nginx-deployment

  deploy-ingress:
    needs: deploy-service
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # 1. Keyless Auth
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ secrets.GCP_WORKLOAD_PROVIDER }}
        service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

    # 2. Generate Fresh Kubeconfig
    - name: Set up GKE Credentials
      uses: google-github-actions/get-gke-credentials@v2
      with:
        cluster_name: ${{ secrets.GCP_CLUSTER_NAME }}
        location: ${{ secrets.GCP_REGION }}
        project_id: ${{ secrets.GCP_PROJECT_ID }}
        use_auth_provider: false

    # 3. Deploy Routing Layer
    - name: Deploy Ingress Routing Layer
      run:
        kubectl apply -f k8s-ingress.yml
    - name: Parse Configuration & Compile Templates
      run: |
        # 1. Parse the env file variables
        export APP_NAME=$(grep APP_NAME active-config.env | cut -d '=' -f2)
        export CONTAINER_PORT=$(grep CONTAINER_PORT active-config.env | cut -d '=' -f2)
        export INGRESS_NAME=$(grep INGRESS_NAME active-config.env | cut -d '=' -f2)
        export DOCKERHUB_USERNAME=$(grep DOCKERHUB_USERNAME active-config.env | cut -d '=' -f2)

        # 2. Compile the templates
        envsubst < k8s-service.tmpl.yml > k8s-service.yml
        envsubst < k8s-ingress.tmpl.yml > k8s-ingress.yml

        # 3. Apply changes to GKE Autopilot
        kubectl apply -f k8s-service.yml
        kubectl apply -f k8s-ingress.yml
        kubectl rollout restart deployment/$APP_NAME-deployment
