name: Production Web Pages, Service, and Ingress CI/CD

on:
  push:
    branches: [ "main" ]

# ⚠️ CRUCIAL: Gives the runner permission to exchange tokens with Google Cloud keylessly
permissions:
  contents: read
  id-token: write

jobs:
  build-and-push-web-image:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push Docker image with Web Content
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/M-project:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/M-project:${{ github.sha }}

  deploy-service:
    needs: build-and-push-web-image
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # 1. KEYLESS OIDC AUTHENTICATION: Exchanges temporary tokens with your Workload Pool
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ secrets.GCP_WORKLOAD_PROVIDER }}
        service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

    # 2. Set up Kubeconfig Context for GKE
    - name: Set up Kubeconfig Context
      uses: azure/k8s-set-context@v4
      with:
        method: kubeconfig
        kubeconfig: ${{ secrets.KUBERNETES_KUBECONFIG }}

    # 3. Automatically inject the missing gke-gcloud-auth-plugin tool into the runner
    - name: Set up GKE Auth Plugin
      uses: google-github-actions/get-gke-credentials@v2
      with:
        cluster_name: ${{ secrets.GCP_CLUSTER_NAME }}
        location: ${{ secrets.GCP_REGION }}
        project_id: ${{ secrets.GCP_PROJECT_ID }}
        use_auth_provider: true 

    # 4. Apply Kubernetes Manifests and restart the pods to grab the fresh Docker image
    - name: Deploy Service App Layer (Web App Update)
      run: |
        kubectl apply -f k8s-service.yml
        kubectl rollout restart deployment/nginx-deployment

  deploy-ingress:
    needs: deploy-service 
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # 1. Keyless Auth for the Ingress Stage
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ secrets.GCP_WORKLOAD_PROVIDER }}
        service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

    # 2. Set up Kubeconfig Context
    - name: Set up Kubeconfig Context
      uses: azure/k8s-set-context@v4
      with:
        method: kubeconfig
        kubeconfig: ${{ secrets.KUBERNETES_KUBECONFIG }}

    # 3. Inject GKE Auth Plugin
    - name: Set up GKE Auth Plugin
      uses: google-github-actions/get-gke-credentials@v2
      with:
        cluster_name: ${{ secrets.GCP_CLUSTER_NAME }}
        location: ${{ secrets.GCP_REGION }}
        project_id: ${{ secrets.GCP_PROJECT_ID }}
        use_auth_provider: true

    # 4. Apply Routing Matrix
    - name: Deploy Ingress Routing Layer
      run: |
        kubectl apply -f k8s-ingress.yml
