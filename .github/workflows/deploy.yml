name: Production Web Pages, Service, and Ingress CI/CD

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push-web-image:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push Docker image with Web Content
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/nginx:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/nginx:${{ github.sha }}

  deploy-service:
    needs: build-and-push-web-image
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # 1. Write the kubeconfig data to the workspace profile
    - name: Set up Kubeconfig Context
      uses: azure/k8s-set-context@v4
      with:
        method: kubeconfig
        kubeconfig: ${{ secrets.KUBERNETES_KUBECONFIG }}

    # 2. Automatically inject the missing gke-gcloud-auth-plugin tool
    - name: Set up GKE Auth Plugin
      uses: google-github-actions/get-gke-credentials@v2
      with:
        cluster_name: ${{ secrets.GCP_CLUSTER_NAME }}
        location: ${{ secrets.GCP_REGION }}
        project_id: ${{ secrets.GCP_PROJECT_ID }}
        use_auth_provider: true # This configures the necessary client-go authentication plugin automatically

    - name: Deploy Service App Layer (Web App Update)
      run: |
        kubectl apply -f k8s-service.yml
        kubectl rollout restart deployment/nginx-deployment

  deploy-ingress:
    needs: deploy-service 
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Kubeconfig Context
      uses: azure/k8s-set-context@v4
      with:
        method: kubeconfig
        kubeconfig: ${{ secrets.KUBERNETES_KUBECONFIG }}

    - name: Set up GKE Auth Plugin
      uses: google-github-actions/get-gke-credentials@v2
      with:
        cluster_name: ${{ secrets.GCP_CLUSTER_NAME }}
        location: ${{ secrets.GCP_REGION }}
        project_id: ${{ secrets.GCP_PROJECT_ID }}
        use_auth_provider: true

    - name: Deploy Ingress Routing Layer
      run: |
        kubectl apply -f k8s-ingress.yml
