server {
    listen       80;
    server_name  localhost;

    # Main location for your website homepage
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }

    # Custom 404 handler
    error_page  404              /404.html;
    location = /404.html {
        root   /usr/share/nginx/html;
        internal;
    }

    # ---- NEW: Custom 500 & 502 Handlers ----
    
    # Map 500 Internal Server Error
    error_page 500 /500.html;
    location = /500.html {
        root   /usr/share/nginx/html;
        internal;
    }

    # Map 502 Bad Gateway
    error_page 502 /502.html;
    location = /502.html {
        root   /usr/share/nginx/html;
        internal;
    }
    
    # ----------------------------------------

    # Fallback for remaining server errors (503 Service Unavailable, 504 Gateway Timeout)
    error_page   503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
