apiVersion: apps/v1
kind: Deployment
metadata:
  name: $APP_NAME-deployment
  labels:
    app: $APP_NAME-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: $APP_NAME-web
  template:
    metadata:
      labels:
        app: $APP_NAME-web
    spec:
      containers:
      - name: $APP_NAME-container
        image: docker.io/$DOCKERHUB_USERNAME/nginx:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: $APP_NAME-service
spec:
  type: ClusterIP
  selector:
    app: $APP_NAME-web
  ports:
    - port: $CONTAINER_PORT
      targetPort: 80
